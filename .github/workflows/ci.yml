name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.kit }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kit: music
            node: 22
          - kit: moderator
            node: 20
    defaults:
      run:
        working-directory: kits/${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: kits/${{ matrix.kit }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
