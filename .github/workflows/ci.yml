name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.kit }} / Node 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: [music, moderator]
    defaults:
      run:
        working-directory: kits/${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kits/${{ matrix.kit }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
